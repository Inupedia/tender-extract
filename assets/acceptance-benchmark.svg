  </defs>
  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <text x="64" y="72" fill="#f4f7ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700">真实招投标文档验收</text>
  <text x="64" y="108" fill="#9eacc8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">仓库内 13 份真实采购 / 招投标 PDF · GitHub Actions 实测 · 不启用大模型</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="64" y="148" width="202" height="132" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.10"/>
