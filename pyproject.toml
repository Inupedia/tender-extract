[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tender-extract"
version = "0.3.0"
description = "面向中文标书的混合抽取流水线"
authors = [
    {name = "Tender Extract Team", email = "team@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=3.0.0",
    "pyahocorasick>=2.0.0",
    "rapidfuzz>=3.0.0",
    "datasketch>=1.5.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "jieba>=0.42.1",
    "langchain-text-splitters>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "coverage==7.10.7",
]
pdf = [
    "pymupdf>=1.23.0",
]
docx = [
    "python-docx>=1.0.0",
]
ocr = [
    "paddlepaddle>=3.0.0",
    "paddleocr>=3.0.0",
]
all = [
    "pymupdf>=1.23.0",
    "python-docx>=1.0.0",
    "paddlepaddle>=3.0.0",
    "paddleocr>=3.0.0",
    "pytest>=8.0.0",
    "coverage==7.10.7",
]

[project.scripts]
tender-extract = "tender_extract.cli:app"
tender-review = "tender_extract.review_cli:app"
tender-package = "tender_extract.package_cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tender_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]
markers = [
    "unit: isolated fast tests without filesystem/network integration",
    "integration: tests crossing package components or document formats",
    "e2e: end-to-end tests through public CLI or full pipeline entry points",
    "live: opt-in tests that call external services and require secrets",
]

[tool.coverage.run]
core = "sysmon"
relative_files = true
source = ["tender_extract"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.typer]
help = "面向中文标书的混合抽取流水线"
