name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync unit test dependencies
        run: uv sync --extra dev
      - name: Run unit tests
        run: uv run pytest -q tests/unit -m unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync document integration dependencies
        run: uv sync --extra dev --extra pdf --extra docx
      - name: Run integration tests
        run: uv run pytest -q tests/integration -m integration

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync E2E dependencies
        run: uv sync --extra dev
      - name: Run CLI E2E tests
        run: uv run pytest -q tests/e2e -m e2e

  coverage:
    name: regression + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync core test dependencies
        run: uv sync --extra dev
      - name: Compile package
        run: uv run python -m compileall -q src
      - name: Run core regression paths with coverage
        run: >-
          uv run pytest -q
          tests/test_pipeline.py
          tests/test_module_router.py
          tests/test_hardening.py
          tests/unit
          tests/integration/test_pipeline_integration.py
          tests/e2e
          -m "not live"
          --cov=tender_extract
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=65
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Build package
        run: uv build
