name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync development dependencies
        run: uv sync --extra dev
      - name: Compile package
        run: uv run python -m compileall -q src
      - name: Run tests
        run: uv run pytest -q
      - name: Build package
        run: uv build
