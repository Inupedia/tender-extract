name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync unit test dependencies
        run: uv sync --extra dev
      - name: Run unit tests with coverage data
        env:
          COVERAGE_FILE: .coverage.unit
        run: .venv/bin/python -m coverage run --parallel-mode -m pytest -q tests/unit -m unit
      - name: Upload unit coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-unit
          path: .coverage.unit.*
          include-hidden-files: true

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync document integration dependencies
        run: uv sync --extra dev --extra pdf --extra docx
      - name: Run integration tests with coverage data
        env:
          COVERAGE_FILE: .coverage.integration
        run: .venv/bin/python -m coverage run --parallel-mode -m pytest -q tests/integration -m integration
      - name: Upload integration coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-integration
          path: .coverage.integration.*
          include-hidden-files: true

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync E2E dependencies
        run: uv sync --extra dev
      - name: Run CLI E2E tests with coverage data
        env:
          COVERAGE_FILE: .coverage.e2e
        run: .venv/bin/python -m coverage run --parallel-mode -m pytest -q tests/e2e -m e2e
      - name: Upload E2E coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-e2e
          path: .coverage.e2e.*
          include-hidden-files: true

  regression:
    name: legacy regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync regression dependencies
        run: uv sync --extra dev
      - name: Compile package
        run: .venv/bin/python -m compileall -q src
      - name: Run existing regression tests with coverage data
        env:
          COVERAGE_FILE: .coverage.regression
        run: >-
          .venv/bin/python -m coverage run --parallel-mode -m pytest -q
          tests/test_pipeline.py
          tests/test_module_router.py
          tests/test_hardening.py
      - name: Upload regression coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-regression
          path: .coverage.regression.*
          include-hidden-files: true

  coverage:
    name: combined coverage
    needs: [unit, integration, e2e, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync coverage tooling
        run: uv sync --extra dev
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: .coverage-data
          merge-multiple: true
      - name: Combine coverage and enforce floor
        run: |
          cp .coverage-data/.coverage.* .
          .venv/bin/python -m coverage combine
          .venv/bin/python -m coverage report --fail-under=65
          .venv/bin/python -m coverage xml
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Build package
        run: uv build
