name: Server Image

on:
  pull_request:
    paths:
      - "src/tender_extract/**"
      - "server_tests/**"
      - "examples/example.pdf"
      - "Dockerfile.server"
      - "pyproject.toml"
      - ".github/workflows/server-image.yml"
  push:
    tags:
      - "server-v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tender-extract-server

jobs:
  test-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve server version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#server-v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid server release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          else
            version="dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build server container
        run: >-
          docker build
          --file Dockerfile.server
          --build-arg SERVER_VERSION=${{ steps.version.outputs.version }}
          --tag tender-extract-server:test
          .

      - name: Smoke test container with real PDF
        run: |
          docker run --rm -d \
            --name tender-extract-server-test \
            -p 8000:8000 \
            -e TENDER_SERVER_API_KEY=ci-test-key \
            tender-extract-server:test
          trap 'docker rm -f tender-extract-server-test >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz >/tmp/health.json; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/healthz >/tmp/health.json
          curl --fail --silent http://127.0.0.1:8000/v1/info >/tmp/info.json

          status=$(curl --silent --output /tmp/unauthorized.json --write-out '%{http_code}' \
            -F "file=@examples/example.pdf;type=application/pdf" \
            "http://127.0.0.1:8000/v1/extract?llm_provider=none&use_ocr=false")
          test "$status" = "401"

          curl --fail --silent \
            -H "X-API-Key: ci-test-key" \
            -F "file=@examples/example.pdf;type=application/pdf" \
            "http://127.0.0.1:8000/v1/extract?llm_provider=none&use_ocr=false" \
            > /tmp/extract.json

          python - "${{ steps.version.outputs.version }}" <<'PY'
          import json
          import sys

          expected_version = sys.argv[1]
          info = json.load(open('/tmp/info.json', encoding='utf-8'))
          payload = json.load(open('/tmp/extract.json', encoding='utf-8'))
          result = payload['result']

          assert info['version'] == expected_version
          assert payload['server_version'] == expected_version
          assert result['metadata']['total_pages'] == 10
          assert result['fields']['project_number']['primary_value'] == '2024BFFFZ01583'
          assert result['fields']['tenderer']['primary_value'] == '合肥市公安局瑶海分局'
          print('container smoke test passed')
          PY

  publish:
    if: startsWith(github.ref, 'refs/tags/server-v')
    needs: test-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            SERVER_VERSION=${{ needs.test-image.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.test-image.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          provenance: false
          sbom: false
