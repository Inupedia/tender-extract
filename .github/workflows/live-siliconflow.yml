name: SiliconFlow Live

on:
  workflow_dispatch:
    inputs:
      model:
        description: SiliconFlow model id
        required: false
        default: Qwen/Qwen2.5-7B-Instruct

permissions:
  contents: read

jobs:
  live-siliconflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      SILICONFLOW_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require SiliconFlow secret
        run: test -n "$SILICONFLOW_API_KEY"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync live test dependencies
        run: uv sync --extra dev
      - name: Run SiliconFlow live test
        run: uv run pytest -q tests/live -m live
