name: SiliconFlow Live

on:
  push:
    branches: [feat/real-world-acceptance-readme]
    paths:
      - "src/**"
      - "tests/live/**"
      - "scripts/live_siliconflow_acceptance.py"
      - "eval/**"
      - "fixtures/**"
      - "examples/example.pdf"
      - ".github/workflows/live-siliconflow.yml"
  workflow_dispatch:
    inputs:
      model:
        description: SiliconFlow model id
        required: false
        default: Qwen/Qwen3-8B

permissions:
  contents: read

jobs:
  live-siliconflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      SILICONFLOW_MODEL: ${{ inputs.model || 'Qwen/Qwen3-8B' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require SiliconFlow secret
        run: test -n "$SILICONFLOW_API_KEY"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync live test dependencies
        run: uv sync --extra dev --extra pdf
      - name: Run direct SiliconFlow live test
        run: uv run pytest -q tests/live -m live
      - name: Run real PDF SiliconFlow acceptance
        run: >-
          uv run python scripts/live_siliconflow_acceptance.py
          --model "$SILICONFLOW_MODEL"
          --report artifacts/siliconflow-live.json
      - name: Run SiliconFlow gold evaluation
        run: >-
          uv run tender-extract eval eval/gold-siliconflow.jsonl
          --llm siliconflow
          --model "$SILICONFLOW_MODEL"
          --fail-under 1.0
          --report artifacts/siliconflow-eval.json
      - name: Upload SiliconFlow reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siliconflow-live-acceptance
          path: artifacts/siliconflow-*.json
