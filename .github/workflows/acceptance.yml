name: Real PDF Acceptance

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/acceptance_corpus.py"
      - "examples/**"
      - ".github/workflows/acceptance.yml"
      - "README.md"
  pull_request:
    paths:
      - "src/**"
      - "scripts/acceptance_corpus.py"
      - "examples/**"
      - ".github/workflows/acceptance.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install package with PDF support
        run: uv sync --extra dev --extra pdf
      - name: Run committed 13-PDF acceptance corpus
        run: >-
          uv run python scripts/acceptance_corpus.py
          --examples examples
          --min-pdfs 13
          --report artifacts/real-pdf-acceptance.json
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-pdf-acceptance
          path: artifacts/real-pdf-acceptance.json
