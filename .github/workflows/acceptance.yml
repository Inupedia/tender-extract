name: Real PDF Acceptance

on:
  push:
    branches: [feat/real-world-acceptance-readme]
  pull_request:
    paths:
      - "src/**"
      - "scripts/acceptance_corpus.py"
      - "examples/**"
      - ".github/workflows/acceptance.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install package with PDF support
        run: uv sync --extra dev --extra pdf
      - name: Run real PDF acceptance
        run: uv run python scripts/acceptance_corpus.py --min-pdfs 1 --report artifacts/acceptance.json
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-pdf-acceptance
          path: artifacts/acceptance.json
