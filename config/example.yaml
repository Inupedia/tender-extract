# 混合抽取流水线配置

base:
  confidence_threshold: 0.7
  use_ner: false
  use_dedupe: false
  use_ocr: true

chunking:
  max_chunk_size: 800
  overlap_size: 100
  chapter_priority: true

llm:
  provider: none
  model: null
  base_url: null
  max_tokens: 800
  temperature: 0.1
  timeout: 60

patterns:
  project_name:
    - pattern: '项目名称[：:]\s*([^，。\n]{5,50})'
      confidence: 0.9
  bid_amount:
    - pattern: '投标金额[：:]\s*([^，。\n]{5,30})'
      confidence: 0.9
  deposit:
    - pattern: '保证金[：:]\s*([^，。\n]{5,30})'
      confidence: 0.85
  date:
    - pattern: '([0-9]{4}[-/年][0-9]{1,2}[-/月][0-9]{1,2}[日]?)'
      confidence: 0.8
  project_number:
    - pattern: '项目编号[：:]\s*([A-Z0-9\-]{5,20})'
      confidence: 0.9

synonyms:
  tender_keywords:
    - "招标"
    - "投标"
    - "开标"
    - "评标"
  company_keywords:
    - "有限公司"
    - "股份有限公司"
    - "集团"

field_priorities:
  project_name: 1
  bidder: 2
  bid_amount: 3
  deposit: 4
  contact_info: 5
  bid_date: 6
  project_number: 7

cache:
  enabled: true
  cache_dir: ".cache"
  expire_hours: 24
